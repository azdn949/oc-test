apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nginx-route
  namespace: azdn949-dev
  labels:
    app: nginx
spec:
  to:
    kind: Service
    name: nginx-service
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
