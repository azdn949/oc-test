apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: azdn949-dev
  labels:
    app: nginx
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"oc-sample:0.3"},"fieldPath":"spec.template.spec.containers[?(@.name==\"nginx\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: oc-sample:0.3
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
