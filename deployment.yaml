apiVersion: apps/v1
kind: Deployment
metadata:
  name: oc-sample-deployment
  namespace: azdn949-dev
  labels:
    app: nginx
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"oc-sample:latest"},"fieldPath":"spec.template.containers[?(@.name==\"nginx\")].image"}]'
spec:
  replicas: 1
  strategy:
    type: Recreate # Prevents multi-attach errors with ReadWriteOnce storage during updates
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: image-registry.openshift-image-registry.svc:5000/azdn949-dev/oc-sample:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        volumeMounts:
        - name: nginx-data
          mountPath: /usr/share/nginx/html # Change this to the directory inside your container
      volumes:
      - name: nginx-data
        persistentVolumeClaim:
          claimName: nginx-storage-pvc


