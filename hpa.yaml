apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oc-sample-hpa
  namespace: azdn949-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oc-sample-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 15
      policies:
      - type: Pods
        value: 2
        periodSeconds: 15

